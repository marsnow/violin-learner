<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>聽音辨音｜音準訓練</title>
    <style>
      :root {
        color: #24344f;
        background: #f6f3ed;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      body { margin: 0; }
      main { margin: 0 auto; max-width: 760px; padding: 28px 16px 48px; }
      h1, h2, p { margin: 0; }
      header { margin-bottom: 22px; }
      .back-link { color: #68758a; display: inline-flex; font-size: 13px; font-weight: 700; margin-bottom: 16px; text-decoration: none; }
      .back-link:hover { color: #24344f; }
      h1 { font-size: clamp(30px, 7vw, 44px); letter-spacing: -1.2px; }
      header p { color: #68758a; font-size: 14px; line-height: 1.7; margin-top: 8px; }
      .card { background: #fff; border: 1px solid #e4e0d8; border-radius: 22px; box-shadow: 0 12px 35px rgba(36, 52, 79, .08); padding: 20px; }
      .topline, .answer-heading { align-items: center; display: flex; justify-content: space-between; gap: 12px; }
      .topline { color: #68758a; font-size: 13px; margin-bottom: 18px; }
      .score { color: #24344f; font-weight: 800; }
      .listen-panel { background: #eef0fb; border: 1px solid #dfe3f5; border-radius: 16px; margin-bottom: 24px; padding: 17px; }
      .listen-heading { align-items: flex-start; display: flex; gap: 15px; justify-content: space-between; }
      .listen-heading h2 { font-size: 18px; }
      .listen-heading p { color: #68758a; font-size: 12px; line-height: 1.6; margin-top: 5px; }
      .tuning-note { color: #68758a; flex: 0 0 auto; font-size: 11px; font-weight: 750; padding-top: 3px; }
      .audio-controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
      .audio-button { align-items: center; background: #fff; border: 1px solid #d8dce6; border-radius: 10px; color: #24344f; cursor: pointer; display: inline-flex; font-size: 12px; font-weight: 800; gap: 6px; min-height: 42px; padding: 0 13px; touch-action: manipulation; }
      .audio-button:hover:not(:disabled) { border-color: #24344f; transform: translateY(-1px); }
      .audio-button:focus-visible, .option-button:focus-visible, .next-button:focus-visible, .back-link:focus-visible { outline: 3px solid #e57d6d; outline-offset: 2px; }
      .audio-button:disabled { cursor: default; opacity: .55; }
      .audio-button span:first-child { font-size: 18px; line-height: 1; }
      .audio-status { color: #68758a; font-size: 12px; margin-top: 9px; min-height: 18px; }
      .answer-group { margin-top: 20px; }
      .answer-heading { font-size: 14px; font-weight: 800; margin-bottom: 9px; }
      .answer-state { color: #8994a5; font-size: 12px; font-weight: 600; }
      .option-grid { display: grid; gap: 8px; }
      .octave-grid { grid-template-columns: repeat(5, 1fr); }
      .letter-grid { grid-template-columns: repeat(7, 1fr); }
      button { font: inherit; }
      .option-button { background: #eef0fb; border: 1px solid transparent; border-radius: 11px; color: #24344f; cursor: pointer; font-size: 18px; font-weight: 800; min-height: 52px; touch-action: manipulation; }
      .letter-group .option-button { background: #fff5d9; }
      .option-button:hover:not(:disabled) { border-color: #24344f; }
      .option-button.is-selected { background: #24344f; color: #fff; }
      .letter-group .option-button.is-selected { background: #ad7921; }
      .option-button:disabled { cursor: default; opacity: .45; }
      .option-button.is-correct { background: #38945f !important; border-color: #38945f; color: #fff; opacity: 1; }
      .option-button.is-wrong { background: #d76259 !important; border-color: #d76259; color: #fff; opacity: 1; }
      .feedback { border-radius: 12px; font-size: 14px; line-height: 1.6; margin-top: 20px; padding: 12px 14px; }
      .feedback.correct { background: #e4f4e9; color: #246b43; }
      .feedback.wrong { background: #fde9e6; color: #a8423b; }
      .next-button { background: #24344f; border: 0; border-radius: 11px; color: #fff; cursor: pointer; display: block; font-size: 14px; font-weight: 800; margin: 14px 0 0 auto; min-height: 46px; padding: 0 17px; }
      .next-button:hover { background: #375174; }
      .complete { text-align: center; }
      .complete h2 { font-size: 28px; }
      .complete p { color: #68758a; line-height: 1.7; margin-top: 10px; }
      .complete strong { color: #24344f; }
      .complete .next-button { margin: 24px auto 0; }
      [hidden] { display: none !important; }
      @media (max-width: 420px) {
        main { padding-left: 12px; padding-right: 12px; }
        .card { border-radius: 18px; padding: 15px; }
        .listen-panel { padding: 14px; }
        .listen-heading { display: block; }
        .tuning-note { display: block; margin-top: 8px; padding-top: 0; }
        .option-button { min-height: 48px; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <a class="back-link" href="./">← 回到視譜練習</a>
        <h1>聽音辨音</h1>
        <p>先聽題目的聲音，再選出八度與音符代號。用耳朵確認音準，不儲存任何練習紀錄。</p>
      </header>

      <section class="card" id="practice" aria-labelledby="question-title">
        <div class="topline">
          <span id="round">第 1 / 10 題</span>
          <span class="score" id="score">本輪答對 0 題</span>
        </div>
        <h2 id="question-title" hidden>聽音辨認音符</h2>

        <section class="listen-panel" aria-labelledby="listen-title">
          <div class="listen-heading">
            <div>
              <h2 id="listen-title">先聽音，再作答</h2>
              <p>可以重複播放，確認音高後再選答案。</p>
            </div>
            <span class="tuning-note">小提琴音域 G3–E7 · A4=442Hz</span>
          </div>
          <div class="audio-controls" role="group" aria-label="播放題目音高">
            <button class="audio-button" id="piano-button" type="button" aria-label="播放鋼琴音色" title="播放鋼琴音色"><span aria-hidden="true">🎹</span><span>鋼琴</span></button>
            <button class="audio-button" id="violin-button" type="button" aria-label="播放小提琴音色" title="播放小提琴音色"><span aria-hidden="true">🎻</span><span>小提琴</span></button>
          </div>
          <p class="audio-status" id="audio-status" aria-live="polite">選擇一種音色開始聆聽。</p>
        </section>

        <div class="answer-group octave-group" aria-labelledby="octave-label">
          <div class="answer-heading"><span id="octave-label">第一行：八度</span><span class="answer-state" id="octave-state">尚未選擇</span></div>
          <div class="option-grid octave-grid" id="octave-options"></div>
        </div>
        <div class="answer-group letter-group" aria-labelledby="letter-label">
          <div class="answer-heading"><span id="letter-label">第二行：音名（A–G）</span><span class="answer-state" id="letter-state">尚未選擇</span></div>
          <div class="option-grid letter-grid" id="letter-options"></div>
        </div>

        <div class="feedback" id="feedback" aria-live="polite" hidden></div>
        <button class="next-button" id="next" type="button" hidden>下一題 →</button>
      </section>

      <section class="card complete" id="complete" aria-live="polite" hidden>
        <h2>本輪完成！</h2>
        <p>你答對了 <strong id="final-score">0 / 10</strong> 題。重新開始後，題目與分數都會重新計算。</p>
        <button class="next-button" id="restart" type="button">再來一輪</button>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/soundfont-player@0.12.0/dist/soundfont-player.min.js"></script>
    <script>
      const TOTAL_QUESTIONS = 10;
      const REFERENCE_FREQUENCY = 442;
      const TUNING_OFFSET_SEMITONES = 12 * Math.log2(REFERENCE_FREQUENCY / 440);
      const NOTE_LETTERS = ["A", "B", "C", "D", "E", "F", "G"];
      const OCTAVES = [3, 4, 5, 6, 7];
      const NOTE_SEMITONES = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
      const SOUNDFONT_NOTES = [
        "G3", "A3", "B3",
        "C4", "D4", "E4", "F4", "G4", "A4", "B4",
        "C5", "D5", "E5", "F5", "G5", "A5", "B5",
        "C6", "D6", "E6", "F6", "G6", "A6", "B6",
        "C7", "D7", "E7",
      ];
      const VIOLIN_NOTES = buildViolinNotes();
      const NOTE_IDS = new Set(VIOLIN_NOTES.map((note) => note.id));
      const state = { question: null, selectedOctave: null, selectedLetter: null, answered: false, round: 1, score: 0, previousId: null };
      let audioContext = null;
      const instrumentPromises = new Map();

      const elements = {
        practice: document.querySelector("#practice"),
        complete: document.querySelector("#complete"),
        round: document.querySelector("#round"),
        score: document.querySelector("#score"),
        audioStatus: document.querySelector("#audio-status"),
        pianoButton: document.querySelector("#piano-button"),
        violinButton: document.querySelector("#violin-button"),
        octaveOptions: document.querySelector("#octave-options"),
        letterOptions: document.querySelector("#letter-options"),
        octaveState: document.querySelector("#octave-state"),
        letterState: document.querySelector("#letter-state"),
        feedback: document.querySelector("#feedback"),
        nextButton: document.querySelector("#next"),
        finalScore: document.querySelector("#final-score"),
        restart: document.querySelector("#restart"),
      };

      function buildViolinNotes() {
        const notes = [];
        const startMidi = 3 * 12 + 12 + NOTE_SEMITONES.G;
        const endMidi = 7 * 12 + 12 + NOTE_SEMITONES.E;
        for (const octave of OCTAVES) {
          for (const letter of NOTE_LETTERS) {
            const midi = noteMidi(`${letter}${octave}`);
            if (midi >= startMidi && midi <= endMidi) notes.push({ id: `${letter}${octave}`, octave, letter });
          }
        }
        return notes;
      }

      function noteMidi(noteId) {
        const match = /^([A-G])(\d)$/.exec(noteId);
        return match ? (Number(match[2]) + 1) * 12 + NOTE_SEMITONES[match[1]] : null;
      }

      function updateAudioButtons() {
        const noteId = state.question?.id;
        [
          [elements.pianoButton, "鋼琴"],
          [elements.violinButton, "小提琴"],
        ].forEach(([button, instrument]) => {
          button.disabled = !noteId;
          button.setAttribute("aria-label", noteId ? `播放 ${noteId} 的${instrument}音色` : `播放${instrument}音色`);
          button.title = noteId ? `播放 ${noteId} 的${instrument}音色` : `播放${instrument}音色`;
        });
      }

      async function loadInstrument(instrumentName) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext || !window.Soundfont) throw new Error("Sampled audio is not supported");
        audioContext ||= new AudioContext();
        if (!instrumentPromises.has(instrumentName)) {
          instrumentPromises.set(instrumentName, Soundfont.instrument(audioContext, instrumentName, {
            soundfont: "FluidR3_GM",
            format: "mp3",
            notes: SOUNDFONT_NOTES,
            nameToUrl: (name, soundfont, format) => `https://gleitz.github.io/midi-js-soundfonts/${soundfont}/${name}-${format}.js`,
          }));
        }
        try {
          return await instrumentPromises.get(instrumentName);
        } catch (error) {
          instrumentPromises.delete(instrumentName);
          throw error;
        }
      }

      async function playQuestionSound(instrument) {
        if (!state.question) return;
        const button = instrument === "piano" ? elements.pianoButton : elements.violinButton;
        const instrumentLabel = instrument === "piano" ? "鋼琴" : "小提琴";
        const instrumentName = instrument === "piano" ? "acoustic_grand_piano" : "violin";
        button.disabled = true;
        button.setAttribute("aria-busy", "true");
        elements.audioStatus.textContent = `正在載入${instrumentLabel}音色…`;
        try {
          const player = await loadInstrument(instrumentName);
          await audioContext.resume();
          player.play(noteMidi(state.question.id) + TUNING_OFFSET_SEMITONES, undefined, { duration: instrument === "piano" ? 1.4 : 1.8 });
          elements.audioStatus.textContent = `已播放${instrumentLabel}音色，可以重複聆聽。`;
        } finally {
          button.disabled = false;
          button.removeAttribute("aria-busy");
        }
      }

      function createOption(group, value, label) {
        const button = document.createElement("button");
        button.className = "option-button";
        button.type = "button";
        button.textContent = label;
        button.dataset.group = group;
        button.dataset.value = value;
        button.addEventListener("click", () => selectAnswer(group, value, button));
        return button;
      }

      function renderOptions() {
        elements.octaveOptions.replaceChildren(...OCTAVES.map((value) => createOption("octave", String(value), String(value))));
        elements.letterOptions.replaceChildren(...NOTE_LETTERS.map((value) => createOption("letter", value, value)));
        updateOptionAvailability();
      }

      function updateOptionAvailability() {
        document.querySelectorAll(".option-button").forEach((button) => {
          const { group, value } = button.dataset;
          const isSelected = group === "octave" ? state.selectedOctave === value : state.selectedLetter === value;
          const otherValue = group === "octave" ? state.selectedLetter : state.selectedOctave;
          const isValid = !otherValue || NOTE_IDS.has(group === "octave" ? `${otherValue}${value}` : `${value}${otherValue}`);
          button.disabled = state.answered || !isValid;
          button.classList.toggle("is-selected", isSelected);
        });
      }

      function selectAnswer(group, value) {
        if (state.answered) return;
        if (group === "octave") {
          state.selectedOctave = value;
          elements.octaveState.textContent = value;
        } else {
          state.selectedLetter = value;
          elements.letterState.textContent = value;
        }
        updateOptionAvailability();
        if (state.selectedOctave && state.selectedLetter) checkAnswer();
      }

      function checkAnswer() {
        state.answered = true;
        const correct = state.question.id === `${state.selectedLetter}${state.selectedOctave}`;
        if (correct) state.score += 1;
        document.querySelectorAll(".option-button").forEach((button) => {
          const isCorrect = button.dataset.group === "octave"
            ? button.dataset.value === String(state.question.octave)
            : button.dataset.value === state.question.letter;
          const isWrong = button.classList.contains("is-selected") && !isCorrect;
          button.classList.toggle("is-correct", isCorrect);
          button.classList.toggle("is-wrong", isWrong);
        });
        elements.score.textContent = `本輪答對 ${state.score} 題`;
        elements.feedback.className = `feedback ${correct ? "correct" : "wrong"}`;
        elements.feedback.textContent = correct
          ? `答對了！這是 ${state.question.octave}+${state.question.letter}。`
          : `再聽一次，正確答案是 ${state.question.octave}+${state.question.letter}。`;
        elements.feedback.hidden = false;
        elements.nextButton.hidden = false;
        updateOptionAvailability();
      }

      function chooseQuestion() {
        const choices = VIOLIN_NOTES.filter((note) => note.id !== state.previousId);
        state.question = choices[Math.floor(Math.random() * choices.length)];
        state.previousId = state.question.id;
      }

      function newQuestion() {
        chooseQuestion();
        state.selectedOctave = null;
        state.selectedLetter = null;
        state.answered = false;
        elements.round.textContent = `第 ${state.round} / ${TOTAL_QUESTIONS} 題`;
        elements.feedback.hidden = true;
        elements.nextButton.hidden = true;
        elements.octaveState.textContent = "尚未選擇";
        elements.letterState.textContent = "尚未選擇";
        elements.audioStatus.textContent = "選擇一種音色開始聆聽。";
        renderOptions();
        updateAudioButtons();
      }

      function nextQuestion() {
        if (!state.answered) return;
        if (state.round === TOTAL_QUESTIONS) {
          elements.practice.hidden = true;
          elements.finalScore.textContent = `${state.score} / ${TOTAL_QUESTIONS}`;
          elements.complete.hidden = false;
          return;
        }
        state.round += 1;
        newQuestion();
      }

      function restart() {
        state.round = 1;
        state.score = 0;
        state.previousId = null;
        elements.practice.hidden = false;
        elements.complete.hidden = true;
        elements.score.textContent = "本輪答對 0 題";
        newQuestion();
      }

      console.assert(VIOLIN_NOTES[0].id === "G3", "Violin range should start at G3.");
      console.assert(VIOLIN_NOTES[VIOLIN_NOTES.length - 1].id === "E7", "Violin range should end at E7.");
      console.assert(Math.abs(REFERENCE_FREQUENCY - 442) < 0.001, "The reference frequency should be 442 Hz.");
      elements.pianoButton.addEventListener("click", () => playQuestionSound("piano").catch(() => { elements.audioStatus.textContent = "無法播放鋼琴音色，請再試一次。"; }));
      elements.violinButton.addEventListener("click", () => playQuestionSound("violin").catch(() => { elements.audioStatus.textContent = "無法播放小提琴音色，請再試一次。"; }));
      elements.nextButton.addEventListener("click", nextQuestion);
      elements.restart.addEventListener("click", restart);
      newQuestion();
    </script>
  </body>
</html>
